name: Windows

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022]
        configuration: [RiotGamesServers]
    steps:
    - uses: actions/checkout@v3.5.2
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v1.3.1
    - name: Build
      shell: cmd
      run: msbuild R3nzSkin/R3nzSkin.vcxproj /p:Platform=x64 /p:Configuration=${{ matrix.configuration }}
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: skin-${{ matrix.configuration }}
        path: |
          Release/${{ matrix.configuration }}/R3nzSkin.dll
          R3nzSkin/Release/${{ matrix.configuration }}/R3nzSkin.dll
        retention-days: 7
        if-no-files-found: error
